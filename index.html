<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人作品</title>
  <!-- 引入思源黑体 -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      background: #f5f7fa; color: #2c3e50;
    }
    a { text-decoration: none; color: #3a6ea5; }
    .wrapper { display: flex; height: 100vh; }
    /* 导航栏：深蓝灰 */
    nav {
      width: 250px; background: #2b3a4a; color: #cfd8e3;
      overflow-y: auto; flex-shrink: 0; padding: 20px 0;
      transition: transform 0.3s ease; z-index: 100;
    }
    nav .logo {
      font-size: 1.2em; font-weight: bold; padding: 0 20px 20px;
      border-bottom: 1px solid #3e5062; margin-bottom: 10px;
      color: #ffffff;
    }
    nav ul { list-style: none; padding: 0 10px; }
    nav li { margin: 2px 0; }
    nav details { margin: 5px 0; }
    nav summary {
      font-weight: bold; padding: 10px 12px; cursor: pointer; border-radius: 4px;
      transition: background 0.2s; outline: none; display: flex; align-items: center;
      color: #cfd8e3;
    }
    nav summary:hover { background: #3e5062; }
    nav summary::-webkit-details-marker { display: none; }
    nav summary::before {
      content: '▸'; margin-right: 6px; font-size: 0.8em;
      transition: transform 0.2s; color: #8fa4bc;
    }
    nav details[open] > summary::before { transform: rotate(90deg); }
    nav a {
      display: block; padding: 8px 12px 8px 32px; border-radius: 4px;
      font-size: 0.95em; color: #b0c0d0; transition: background 0.2s;
    }
    nav a:hover { background: #3e5062; color: #ffffff; }
    nav a.active { background: #4a627a; font-weight: bold; color: #ffffff; }
    /* 手机菜单按钮 */
    .menu-btn {
      display: none; position: fixed; top: 10px; left: 10px; z-index: 200;
      background: #2b3a4a; color: #fff; border: none; padding: 10px 16px;
      border-radius: 6px; font-size: 1em; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4); z-index: 90;
    }
    /* 内容区：白底，大字号 */
    main {
      flex: 1; padding: 50px; overflow-y: auto;
      font-size: 19px; line-height: 1.9;
      max-width: 820px; margin: 0 auto; background: #ffffff;
    }
    main h1 { font-size: 2.2em; margin-bottom: 0.6em; color: #1e2c3a; font-weight: 700; }
    main h2 { font-size: 1.7em; margin: 1.2em 0 0.5em; color: #2b3a4a; font-weight: 700; }
    main p { margin-bottom: 1.2em; }
    main blockquote {
      border-left: 4px solid #8fa4bc; padding-left: 20px; color: #4a627a;
      margin: 1.2em 0; font-style: italic; background: #f0f3f7; padding: 15px 20px;
      border-radius: 0 6px 6px 0;
    }
    main hr { border: none; border-top: 1px solid #e2e8f0; margin: 2em 0; }
    main a { color: #2b5f8e; text-decoration: underline; }
    footer {
      margin-top: 2.5em; color: #8fa4bc; font-size: 0.85em;
      border-top: 1px solid #e2e8f0; padding-top: 20px;
    }
    /* 版权保护 */
    body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
    /* 手机适配 */
    @media (max-width: 768px) {
      .wrapper { flex-direction: column; }
      nav {
        position: fixed; top: 0; left: 0; height: 100%; width: 260px;
        transform: translateX(-100%);
        box-shadow: 2px 0 12px rgba(0,0,0,0.2);
      }
      nav.open { transform: translateX(0); }
      .menu-btn { display: block; }
      .overlay.open { display: block; }
      main { padding: 25px; margin-top: 60px; }
    }
  </style>
  <script>
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('selectstart', e => e.preventDefault());
  </script>
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JFTES4PWBZ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-JFTES4PWBZ');
  </script>
</head>
<body>
  <button class="menu-btn" onclick="toggleMenu()">☰ 目录</button>
  <div class="overlay" onclick="toggleMenu()"></div>
  <div class="wrapper">
    <nav id="navbar">
      <div class="logo">📖 个人作品</div>
      <ul>
        <li><a href="#" onclick="loadContent('README.md', this)">🏠 首页</a></li>
        <li>
          <details open>
            <summary>📚 裂缝系列</summary>
            <a href="#" onclick="loadContent('lie-feng/index.md', this)">系列总览</a>
            <a href="#" onclick="loadContent('lie-feng/contents.md', this)">总目录</a>
            <a href="#" onclick="loadContent('lie-feng/trial.md', this)">试读章节</a>
            <a href="#" onclick="loadContent('lie-feng/volume1.md', this)">第一卷</a>
          </details>
        </li>
        <li>
          <details open>
            <summary>🌏 天下神祇</summary>
            <a href="#" onclick="loadContent('tianxia-shenzhi/index.md', this)">系列总览</a>
            <a href="#" onclick="loadContent('tianxia-shenzhi/trial.md', this)">试读章节</a>
            <a href="#" onclick="loadContent('tianxia-shenzhi/volume1.md', this)">第一卷</a>
          </details>
        </li>
        <li>
          <details open>
            <summary>📖 思想简史</summary>
            <a href="#" onclick="loadContent('sixiang-jianshi/index.md', this)">系列总览</a>
            <a href="#" onclick="loadContent('sixiang-jianshi/trial.md', this)">试读章节</a>
            <a href="#" onclick="loadContent('sixiang-jianshi/volume1.md', this)">第一卷</a>
          </details>
        </li>
        <li>
          <details open>
            <summary>📝 人间卧龙凤雏</summary>
            <a href="#" onclick="loadContent('long-feng-chu/index.md', this)">系列总览</a>
            <a href="#" onclick="loadContent('long-feng-chu/trial.md', this)">试读章节</a>
            <a href="#" onclick="loadContent('long-feng-chu/volume1.md', this)">第一卷</a>
          </details>
        </li>
        <li><a href="#" onclick="loadContent('about.md', this)">👤 关于作者</a></li>
      </ul>
    </nav>
    <main id="content">
      <h1>欢迎</h1>
      <p>请从左侧导航选择章节阅读。</p>
      <footer>© 2026 朱晓宇 / 华文声远。保留所有权利。</footer>
    </main>
  </div>

  <script>
    function toggleMenu() {
      const nav = document.getElementById('navbar');
      const overlay = document.querySelector('.overlay');
      nav.classList.toggle('open');
      overlay.classList.toggle('open');
    }

    document.querySelectorAll('nav a').forEach(link => {
      link.addEventListener('click', function() {
        if (window.innerWidth <= 768) {
          toggleMenu();
        }
      });
    });

    function simpleMarkdown(md) {
      if (!md) return '';
      let html = md;
      html = html.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
      html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/`(.+?)`/g, '<code>$1</code>');
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
      html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
      html = html.replace(/^---$/gm, '<hr>');
      let paragraphs = html.split(/\n\n+/);
      html = paragraphs.map(p => {
        p = p.trim();
        if (p.startsWith('<h') || p.startsWith('<blockquote') || p.startsWith('<hr')) return p;
        return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
      }).join('');
      return html;
    }

    async function loadContent(file, el) {
      try {
        const res = await fetch(file);
        if (!res.ok) throw new Error('文件未找到');
        const text = await res.text();
        let html;
        if (file.endsWith('about.md')) {
          html = text;
        } else {
          html = simpleMarkdown(text);
        }
        document.getElementById('content').innerHTML = html + '<footer>© 2026 朱晓宇 / 华文声远。保留所有权利。</footer>';
        document.querySelectorAll('nav a.active').forEach(a => a.classList.remove('active'));
        if (el) el.classList.add('active');
        window.scrollTo(0, 0);
        // 告诉 Google Analytics 页面已切换
        gtag('config', 'G-JFTES4PWBZ', { page_path: file });
      } catch (e) {
        document.getElementById('content').innerHTML = '<p style="color:red;">加载失败：' + e.message + '</p>';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadContent('README.md', document.querySelector('nav a[href="#"][onclick*="README.md"]'));
    });
  </script>
</body>
</html>
